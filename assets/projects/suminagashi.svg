<rect x="68.4" y="364" width="73.4" height="20" rx="2" fill="#141414" stroke="#262626"/><text x="75.4" y="378" font-size="10.5" fill="#7a7a7a">Shadertoy</text>
<rect x="147.8" y="364" width="80.0" height="20" rx="2" fill="#141414" stroke="#262626"/><text x="154.8" y="378" font-size="10.5" fill="#7a7a7a">Generative</text>
<rect width="300" height="420" fill="url(#scan)"/>
<rect x="-300" y="0" width="200" height="420" fill="url(#foil)" transform="skewX(-20)"><animate attributeName="x" values="-300;-300;500" keyTimes="0;.6;1" dur="7s" begin="3.5s" repeatCount="indefinite"/></rect>
</g></svg>