<svg width="300" height="420" viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace">
<title>Suminagashi</title>
<defs>
