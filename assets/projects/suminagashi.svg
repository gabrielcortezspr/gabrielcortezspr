e="stroke-opacity" values=".8;0" dur="4.5s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="222.0" cy="166.0" r="2" fill="none" stroke="#b8b8b8" stroke-width="1.2"><animate attributeName="r" values="2;60" dur="4.5s" begin="-1.5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".8;0" dur="4.5s" begin="-1.5s" repeatCount="indefinite"/></circle><circle cx="190.0" cy="90.0" r="2" fill="none" stroke="#b8b8b8" stroke-width="1.2"><animate attributeName="r" values="2;60" dur="4.5s" begin="-3.0s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".8;0" dur="4.5s" begin="-3.0s" repeatCount="indefinite"/></circle></g><rect x="147.0" y="56" width="6" height="6" fill="#f2f2f2"><animate attributeName="y" values="56;137.0" dur="6s" keyTimes="0;1" keySplines=".5 0 1 1" calcMode="spline" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.95;1" dur="6s" repeatCount="indefinite"/></rect><text x="266" y="74" text-anchor="end" font-size="16" fill="#7a7a7a">墨流し</text></g>
<rect x="22" y="52" width="256" height="176" fill="none" stroke="#262626" stroke-width="2"/>
<text x="22" y="262" font-size="22" font-weight="700" fill="#f2f2f2">Suminagashi</text>
<rect x="22" y="272" width="28" height="3" fill="#9a9a9a"/>
<text x="22" y="296" font-size="11.5" fill="#b8b8b8">GLSL shader recreating the</text>
<text x="22" y="312" font-size="11.5" fill="#b8b8b8">Japanese ink-marbling art. It is</text>
<text x="22" y="328" font-size="11.5" fill="#b8b8b8">the live background of my site.</text>
