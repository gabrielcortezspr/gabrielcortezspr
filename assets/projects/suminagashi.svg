<clipPath id="artclip"><rect x="22" y="52" width="256" height="176"/></clipPath>
<clipPath id="cardclip"><rect x="6" y="6" width="280" height="400" rx="10"/></clipPath>
<linearGradient id="foil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".025"/></pattern>
<pattern id="chk" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#121212"/><rect x="8" y="8" width="8" height="8" fill="#121212"/></pattern>
</defs>
<rect x="14" y="14" width="280" height="400" rx="10" fill="#050505" opacity="0.9"/>
<rect x="6" y="6" width="280" height="400" rx="10" fill="#0a0a0a" stroke="#9a9a9a" stroke-width="3"/>
<g clip-path="url(#cardclip)">
<text x="22" y="36" font-size="11" letter-spacing="2" fill="#9a9a9a">UNCOMMON</text>
<text x="264" y="36" text-anchor="end" font-size="11" fill="#4a4a4a">05</text>
<rect x="22" y="52" width="256" height="176" fill="#0d0d0d"/><rect x="22" y="52" width="256" height="176" fill="url(#chk)"/>
